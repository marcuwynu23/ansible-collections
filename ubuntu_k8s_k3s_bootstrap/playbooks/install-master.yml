---
# Installs the K3s control-plane on the [master] group (first or additional server).
# Usage:
#   cp playbooks/inventory.ini.example inventory.ini  # adjust hosts/key
#   ansible-playbook -i inventory.ini playbooks/install-master.yml
- name: Install K3s master (control-plane) node on Ubuntu
  hosts: master
  become: true
  vars:
    # Standalone containerd is not needed: K3s ships its own embedded
    # containerd. Set to true only if you also want system containerd.
    containerd_enabled: false
    containerd_state: present
    k3s_type: server
    k3s_state: present
    # Pin a version like "v1.30.2+k3s1" or leave empty for latest stable.
    k3s_version: ""
    # First server leaves these empty; additional servers joining a
    # cluster must set both:
    # k3s_server_url: "https://192.168.1.100:6443"
    # k3s_token: "<paste-master-node-token>"
    k3s_server_url: ""
    k3s_token: ""
    k3s_config_extra: {}
  roles:
    - roles/pre
    - roles/containerd
    - roles/k3s
  # After install, get the worker join token with:
  #   sudo cat /var/lib/rancher/k3s/server/node-token
