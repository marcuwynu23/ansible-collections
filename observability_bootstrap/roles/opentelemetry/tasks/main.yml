---
- name: Set desired OpenTelemetry state
  set_fact:
    opentelemetry_desired_state: "{{ opentelemetry_state | default('present') }}"
    opentelemetry_version: "{{ opentelemetry_version | default('0.154.0') }}"

- name: Install required packages for OpenTelemetry
  apt:
    name:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    state: present
    update_cache: yes
    install_recommends: yes
    force_apt_get: yes
  become: true
  retries: 5
  delay: 10
  register: apt_opentelemetry_req
  until: apt_opentelemetry_req is not failed
  when: opentelemetry_desired_state == "present"

- name: Download OpenTelemetry Collector deb package
  ansible.builtin.get_url:
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ opentelemetry_version }}/otelcol-contrib_{{ opentelemetry_version }}_linux_amd64.deb"
    dest: "/tmp/otelcol-contrib_{{ opentelemetry_version }}_linux_amd64.deb"
    mode: '0644'
  become: true
  retries: 5
  delay: 10
  when: opentelemetry_desired_state == "present"

- name: Install OpenTelemetry Collector
  ansible.builtin.apt:
    deb: "/tmp/otelcol-contrib_{{ opentelemetry_version }}_linux_amd64.deb"
    state: present
  become: true
  retries: 5
  delay: 10
  register: apt_opentelemetry_install
  until: apt_opentelemetry_install is not failed
  when: opentelemetry_desired_state == "present"

- name: Clean up OpenTelemetry deb package
  ansible.builtin.file:
    path: "/tmp/otelcol-contrib_{{ opentelemetry_version }}_linux_amd64.deb"
    state: absent
  become: true
  when: opentelemetry_desired_state == "present"

- name: Ensure OpenTelemetry Collector service is running
  service:
    name: otelcol-contrib
    state: started
    enabled: true
  when: opentelemetry_desired_state == "present"
  become: true

- name: Stop OpenTelemetry Collector service when removing
  service:
    name: otelcol-contrib
    state: stopped
    enabled: false
  when: opentelemetry_desired_state == "absent"
  ignore_errors: true
  become: true

- name: Remove OpenTelemetry Collector
  apt:
    name: otelcol-contrib
    state: absent
    purge: yes
    autoremove: yes
    force_apt_get: yes
  when: opentelemetry_desired_state == "absent"
  become: true
